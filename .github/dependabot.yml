version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-and-react:
        patterns:
          - expo*
          - react*
          - "@expo/*"
          - "@react-navigation/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
