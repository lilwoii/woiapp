name: Production maintenance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: spottr-production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact maintenance source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1

      - name: Run bounded production maintenance
        env:
          SPOTTR_MAINTENANCE_SUPABASE_URL: ${{ secrets.SPOTTR_MAINTENANCE_SUPABASE_URL }}
          SPOTTR_MAINTENANCE_SERVICE_ROLE_KEY: ${{ secrets.SPOTTR_MAINTENANCE_SERVICE_ROLE_KEY }}
          SPOTTR_ACCOUNT_DELETE_WORKER_SECRET: ${{ secrets.SPOTTR_ACCOUNT_DELETE_WORKER_SECRET }}
          SPOTTR_MEDIA_CLEANUP_SECRET: ${{ secrets.SPOTTR_MEDIA_CLEANUP_SECRET }}
          SPOTTR_MAINTENANCE_PUSH_ENABLED: ${{ vars.SPOTTR_MAINTENANCE_PUSH_ENABLED || 'false' }}
          SPOTTR_PUSH_DISPATCH_SECRET: ${{ secrets.SPOTTR_PUSH_DISPATCH_SECRET }}
          SPOTTR_PUSH_RECEIPT_SECRET: ${{ secrets.SPOTTR_PUSH_RECEIPT_SECRET }}
          SPOTTR_MAINTENANCE_PAYMENTS_ENABLED: ${{ vars.SPOTTR_MAINTENANCE_PAYMENTS_ENABLED || 'false' }}
          SPOTTR_PAYMENT_REFUND_WORKER_SECRET: ${{ secrets.SPOTTR_PAYMENT_REFUND_WORKER_SECRET }}
          SPOTTR_MAINTENANCE_HEARTBEAT_URL: ${{ secrets.SPOTTR_MAINTENANCE_HEARTBEAT_URL }}
        run: node scripts/production-maintenance.mjs
