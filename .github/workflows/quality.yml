name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.84.2

      - name: Replay the full Supabase schema and security chain
        run: npm run test:db-runtime

  shadow-ordering-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spottr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spottr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Prove SQL execution fails closed
        run: |
          if psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/psql_fail_fast_probe.sql; then
            echo "Expected the intentional SQL failure probe to fail" >&2
            exit 1
          fi

      - name: Bootstrap ordering runtime
        run: psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/shadow_ordering_runtime_setup.sql

      - name: Apply shadow-order migration
        run: psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/migrations/20260802000000_shadow_ordering_foundation.sql

      - name: Exercise ordering invariants and RLS
        run: |
          if ! output=$(psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/shadow_ordering_runtime_test.sql 2>&1); then
            printf '%s\n' "$output"
            excerpt=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g')
            printf '::error title=Shadow ordering runtime failed::%s\n' "$excerpt"
            exit 1
          fi
          printf '%s\n' "$output"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject parser-risk and malformed build assets
        run: npm run verify:build-assets

      - name: Test build-asset verifier
        run: npm run test:build-asset-tools

      - name: Test web quality verifier
        run: npm run test:web-quality-tools

      - name: Verify quality workflow invariants
        run: npm run test:workflow-tools

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Type-check
        run: npm run typecheck

      - name: Type-check Edge functions
        run: npm run typecheck:edge

      - name: Lint
        run: npm run lint

      - name: Test with coverage gates
        run: npm run test:ci

      - name: Test Edge function contracts
        run: npm run test:edge

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Test native release verifier
        run: npm run test:native-release-tools

      - name: Test production maintenance control plane
        run: npm run test:maintenance-tools

      - name: Verify native config and export iOS and Android bundles
        run: npm run verify:native-release

      - name: Verify production configuration fails closed
        run: npm run verify:production-config

      - name: Build production web artifact
        run: npm run build:sites

      - name: Install Chromium for rendered web acceptance
        run: npx playwright install --with-deps chromium

      - name: Test rendered accessibility and keyboard behavior
        run: npm run test:web-e2e

      - name: Audit production dependencies
        run: npm run test:audit-tools && npm run audit:production
