name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-ordering-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spottr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spottr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Bootstrap ordering runtime
        run: psql -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/shadow_ordering_runtime_setup.sql

      - name: Apply shadow-order migration
        run: psql -h 127.0.0.1 -U postgres -d spottr_test -f supabase/migrations/20260802000000_shadow_ordering_foundation.sql

      - name: Exercise ordering invariants and RLS
        run: psql -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/shadow_ordering_runtime_test.sql

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject parser-risk and malformed build assets
        run: npm run verify:build-assets

      - name: Test build-asset verifier
        run: npm run test:build-asset-tools

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Type-check
        run: npm run typecheck

      - name: Type-check Edge functions
        run: npm run typecheck:edge

      - name: Lint
        run: npm run lint

      - name: Test with coverage gates
        run: npm run test:ci

      - name: Test Edge function contracts
        run: npm run test:edge

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Test native release verifier
        run: npm run test:native-release-tools

      - name: Verify native config and export iOS and Android bundles
        run: npm run verify:native-release

      - name: Verify production configuration fails closed
        run: npm run verify:production-config

      - name: Build production web artifact
        run: npm run build:sites

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
