name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan reachable Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          scanner="$RUNNER_TEMP/trufflehog"
          output="$RUNNER_TEMP/trufflehog-output.jsonl"
          scanner_error="$RUNNER_TEMP/trufflehog-stderr"
          trap 'rm -f "$archive" "$scanner" "$output" "$scanner_error"' EXIT
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            'https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz'
          printf '%s  %s\n' \
            '7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0' \
            "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" trufflehog
          scanner_status=0
          "$scanner" --log-level=-1 --json git "file://$GITHUB_WORKSPACE" \
            --no-verification \
            --results=unverified,unknown \
            --fail \
            --fail-on-scan-errors \
            --no-update \
            >"$output" 2>"$scanner_error" || scanner_status=$?
          node scripts/verify-trufflehog-output.mjs "$output" "$scanner_error" "$scanner_status"
          echo 'Reachable Git history passed the redacted secret scan.'

  production-sbom:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch checksum-pinned official CycloneDX 1.5 schemas
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="$RUNNER_TEMP/cyclonedx-schema-1.5"
          schema_base='https://raw.githubusercontent.com/CycloneDX/specification/c320fc0f0b46873864927d9d5684eea7ba439728/schema'
          mkdir -p "$schema_dir"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$schema_dir/bom-1.5.schema.json" "$schema_base/bom-1.5.schema.json"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$schema_dir/jsf-0.82.schema.json" "$schema_base/jsf-0.82.schema.json"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$schema_dir/spdx.schema.json" "$schema_base/spdx.schema.json"
          printf '%s  %s\n' \
            '067f7824b08653839ea050ae9e09ca48375eadc2652b0e2a299476e7db90335b' "$schema_dir/bom-1.5.schema.json" \
            '8bae002c25e723db7ee1f26afde680ae1a2b1a8f6b4b4b0fd65dc3becb090aae' "$schema_dir/jsf-0.82.schema.json" \
            '4f6e2b05c05d26a4f2dc5879fbc2fca94b0a28db46289d0c51345621b71cfbfc' "$schema_dir/spdx.schema.json" \
            | sha256sum --check --status

      - name: Generate and verify production CycloneDX SBOM
        env:
          GITHUB_SHA: ${{ github.sha }}
          SPOTTR_CYCLONEDX_SCHEMA_DIR: ${{ runner.temp }}/cyclonedx-schema-1.5
        run: |
          npm run generate:production-sbom
          npm run verify:production-sbom
          sha256sum spottr-production.cdx.json > spottr-production.cdx.json.sha256

      - name: Upload commit-bound production SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spottr-production-sbom-${{ github.sha }}
          path: |
            spottr-production.cdx.json
            spottr-production.cdx.json.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

  full-supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.84.2

      - name: Replay the full Supabase schema and security chain
        run: npm run test:db-runtime

  shadow-ordering-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spottr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spottr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Prove SQL execution fails closed
        run: |
          if psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/psql_fail_fast_probe.sql; then
            echo "Expected the intentional SQL failure probe to fail" >&2
            exit 1
          fi

      - name: Bootstrap ordering runtime
        run: psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/shadow_ordering_runtime_setup.sql

      - name: Apply shadow-order migration
        run: psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/migrations/20260802000000_shadow_ordering_foundation.sql

      - name: Apply zero-money pickup vertical slice
        run: psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/migrations/20260831000000_zero_money_pickup_ordering_vertical_slice.sql

      - name: Apply merchant pickup queue projection
        run: psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/migrations/20260901000000_shadow_order_merchant_queue.sql

      - name: Apply merchant transition and expiry hardening
        run: psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/migrations/20260902000000_shadow_order_transition_maintenance_hardening.sql

      - name: Exercise foundation ordering invariants and RLS
        run: |
          if ! output=$(psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/shadow_ordering_runtime_test.sql 2>&1); then
            printf '%s\n' "$output"
            excerpt=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g')
            printf '::error title=Shadow ordering runtime failed::%s\n' "$excerpt"
            exit 1
          fi
          printf '%s\n' "$output"

      - name: Exercise zero-money menu quote place and cancel
        run: |
          if ! output=$(psql -X -v ON_ERROR_STOP=1 -1 -h 127.0.0.1 -U postgres -d spottr_test -f supabase/tests/zero_money_pickup_ordering_runtime_test.sql 2>&1); then
            printf '%s\n' "$output"
            excerpt=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g')
            printf '::error title=Zero-money pickup runtime failed::%s\n' "$excerpt"
            exit 1
          fi
          printf '%s\n' "$output"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject parser-risk and malformed build assets
        run: npm run verify:build-assets

      - name: Reject malformed source text
        run: npm run verify:text-integrity

      - name: Test source-text verifier
        run: npm run test:text-integrity-tools

      - name: Test build-asset verifier
        run: npm run test:build-asset-tools

      - name: Test web quality verifier
        run: npm run test:web-quality-tools

      - name: Verify quality workflow invariants
        run: npm run test:workflow-tools

      - name: Verify production web release invariants
        run: npm run test:production-web-release-tools

      - name: Test secret-history finding policy
        run: npm run test:secret-history-tools

      - name: Verify CodeQL workflow invariants
        run: npm run test:codeql-tools

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Type-check
        run: npm run typecheck

      - name: Type-check Edge functions
        run: npm run typecheck:edge

      - name: Lint
        run: npm run lint

      - name: Test with coverage gates
        run: npm run test:ci

      - name: Test Edge function contracts
        run: npm run test:edge

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Test native release verifier
        run: npm run test:native-release-tools

      - name: Test production maintenance control plane
        run: npm run test:maintenance-tools

      - name: Test production SBOM verifier
        run: npm run test:production-sbom-tools

      - name: Verify native config and export iOS and Android bundles
        run: npm run verify:native-release

      - name: Verify production configuration fails closed
        run: npm run verify:production-config

      - name: Build production web artifact
        run: npm run build:sites

      - name: Install Chromium for rendered web acceptance
        run: npx playwright install --with-deps chromium

      - name: Test rendered accessibility and keyboard behavior
        run: npm run test:web-e2e

      - name: Audit production dependencies
        run: npm run test:audit-tools && npm run audit:production

      - name: Upload verified Sites release artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spottr-sites-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: true
