name: Refresh Expo lockfile

on:
  push:
    branches:
      - production-hardening-rc
    paths:
      - package.json
      - .github/workflows/refresh-expo-lock.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use the release Node and npm toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Generate and verify the aligned lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          npm ci
          npx expo install --check
          test -s package-lock.json
          sha256sum package-lock.json > package-lock.json.sha256

      - name: Upload the generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-lockfile-${{ github.sha }}
          path: |
            package-lock.json
            package-lock.json.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false
